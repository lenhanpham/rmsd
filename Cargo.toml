[package]
name = "rmsd"
version = "0.0.2"
edition = "2024"
description = "Root-mean-square deviation (RMSD) between molecular structures"
license = "MIT"

[lib]
name = "rmsd"
path = "src/lib.rs"

[[bin]]
name = "rmsd"
path = "src/bin/rmsd.rs"

[dependencies]
nalgebra = "0.35"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
regex = "1"
rayon = "1.12.0"

[dev-dependencies]
approx = "0.5.1"
